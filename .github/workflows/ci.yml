on:
  push:
    branches:
      - main
  pull_request:

name: Continuous integration

# A new push to the same branch or pull request cancels the runs still going
# for the older commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  fmt:
    name: Rustfmt
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all -- -D warnings

  msrv:
    name: MSRV
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --lib
      - run: cargo check --lib --features stealth

  test:
    name: Test Core
    needs: [fmt, clippy, msrv]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib

  test-integration:
    name: Test Integration
    needs: [fmt, clippy, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: RUST_TEST_THREADS=1 cargo test --test '*'

  test-stealth:
    name: Test Stealth
    needs: [fmt, clippy, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --features stealth -- -D warnings
      - run: cargo test --lib --features stealth
      - run: RUST_TEST_THREADS=1 cargo test --test '*' --features stealth

  test-fetcher:
    name: Test Fetcher
    needs: [fmt, clippy, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: RUST_TEST_THREADS=1 cargo test -p chromiumoxide_fetcher

  check-examples:
    name: Check Examples
    needs: [fmt, clippy, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check examples
        run: cargo check --examples --features fetcher,zip8,rustls
      - name: Check oxidewright examples
        run: cargo check -p oxidewright --examples

  oxidewright:
    name: oxidewright (${{ matrix.os }})
    needs: [fmt, clippy, msrv]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rustfmt
        run: cargo fmt -p oxidewright -- --check
      - name: Clippy
        run: cargo clippy -p oxidewright --all-targets -- -D warnings
      - name: Tests (unit, integration with headless Chrome, doc)
        run: cargo test -p oxidewright
