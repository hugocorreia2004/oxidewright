[package]
name = "oxidewright"
version = "0.1.0"
rust-version = "1.85"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hugocorreia2004/oxidewright"
description = "A Rust port of the Playwright API for Chromium, built on chromiumoxide"
keywords = ["playwright", "chrome", "automation", "testing", "cdp"]
categories = ["web-programming", "api-bindings", "development-tools::testing"]
include = [
  "src/**/*",
  "README.md",
  "NOTICE",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[dependencies]
chromiumoxide = { path = "..", version = "0.9", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
tracing = "0.1"
url = "2"
regex = "1"
base64 = "0.22"
fastrand = "2"
# TLS through rustls with the ring provider (no aws-lc, which needs cmake/nasm
# and does not cross-compile well). The provider is installed on first use.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "brotli", "deflate", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha1_smol = "1"
yaml-rust2 = { version = "0.10", default-features = false }
png = "0.17"
ring = "0.17"

[features]
default = ["stealth"]
# Build chromiumoxide with its `stealth` feature: no `Runtime.enable`,
# `Log.enable` or `Performance.enable` and no utility world at attach.
# oxidewright itself never relies on those domains.
stealth = ["chromiumoxide/stealth"]

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
rustls = "0.23"
tokio-rustls = "0.26"
tokio = { version = "1", features = ["full"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = true
